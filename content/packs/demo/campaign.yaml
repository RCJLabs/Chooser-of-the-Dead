# The campaign's economy, family, shop and endings (docs/build-plan.md §1).
# The demo ships Days 1-3; the campaign pack raises lastDay and adds to the
# lists. Numbers are first guesses: `pnpm sim campaign` reports how they play.
# DRAFT: names and text are placeholders until the M7 writing pass.
lastDay: 3
finale: ending.demoEnd
startRings: 10
family:
  - { id: mother, name: family.mother, adult: true }
  - { id: brother, name: family.brother, adult: true }
  - { id: sister, name: family.sister, adult: false }
draupnir: { nights: [9, 18], rings: 8 }
debtFloor: -30
# The least sun a campaign shift has, in seconds, whatever a trip home at dawn takes (docs/tech-spec.md §50).
minSunS: 120
# Upgrades sell back for half what they cost, and once a run, the night the debt would end it, Skögul pays the
# quartermaster instead (docs/tech-spec.md §56): never under the oath.
sellBack: 50
reprieve: { ending: ending.demoted, rings: 0, flag: skogul_paid, text: reprieve.text }
care: { needNights: 2, sickChance: 30, sickNights: 2 }
# Appeals (docs/tech-spec.md §40): the morning after a day, one soul from it may ask to be judged again, on
# that day's rules. Mostly souls sent to the wrong place; now and then one judged rightly tries its luck.
# First guesses for `pnpm sim campaign` to tune.
appeals: { from: 1, afterMistake: 70, otherwise: 25, chancers: 25, bonus: 3, fine: 5 }
# The line at dusk (docs/tech-spec.md §41): souls still waiting come back first the next day, judged by its
# rules. A crowded gate (three or more left) costs Hel's favour, once a night; each of the living left dies in
# the night, and that costs Odin's. Bots slow enough to leave a soul or two now and then never crowd the
# gate; one that runs short every day does four or five nights a run. First guesses.
waiting: { from: 1, crowd: 3, night: { hel: -1 }, died: { odin: -1 } }
worthy: pred.worthy
# The stranger at night is Loki, but nobody says so until Skögul does on Day 12's morning: until then
# the accounts, and the notes after a choice, call him the stranger.
aliases:
  - { faction: loki, name: faction.stranger, untilDay: 12 }
# The first matching row applies; specific rows are tried before wildcards.
standing:
  - { expected: FOLKVANGR, stamped: VALHALLA, fx: { freyja: -2, odin: 1 } }
  - { expected: VALHALLA, stamped: FOLKVANGR, fx: { odin: -2, freyja: 1 } }
  - { expected: HEL, stamped: VALHALLA, fx: { odin: -1, hel: -1 } }
  - { expected: VALHALLA, stamped: '*', fx: { odin: -1 } }
  - { expected: FOLKVANGR, stamped: '*', fx: { freyja: -1 } }
  - { expected: HEL, stamped: '*', fx: { hel: -1 } }
  - { expected: RETURN, stamped: '*', fx: { odin: -1 } }
shop:
  - { id: up.meadHorn, name: shop.meadHorn, text: shop.meadHorn.text, price: 15, since: 1, effect: { questionS: 15 } }
  - { id: up.oiledBier, name: shop.oiledBier, text: shop.oiledBier.text, price: 12, since: 2, effect: { tool: flip, costS: 1 } }
  - { id: up.swanFeather, name: shop.swanFeather, text: shop.swanFeather.text, price: 18, since: 3, effect: { tool: feather, costS: 6 } }
endings:
  - { id: ending.demoted, order: 10, when: { state: debtNights, gte: 2 }, title: ending.demoted.title, text: ending.demoted.text }
  - { id: ending.alone, order: 20, when: { state: family.home, lte: 0 }, title: ending.alone.title, text: ending.alone.text }
  - { id: ending.demoEnd, order: 1000, title: ending.demoEnd.title, text: ending.demoEnd.text }
