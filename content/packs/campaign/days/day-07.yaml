# Day 7: borrowed blades and copied Ulfberhts, the rune-lens. Story (M7 draft): a scandal among the smiths.
day: 7
sunS: 630
decree: decree.d7
scenes: { morning: scene.d7.morning, night: scene.d7.night }
economy:
  wage: 8
  docBonus: 1
  warnings: 2
  fines: [5, 10, 15]
  costs: { hearth: 11, food: 6, medicine: 12 }
params:
  freyjaWhim:
    pool:
      - { id: whim.leftHanded, text: whim.leftHanded, is: { fact: gripHand, is: left } }
      - { id: whim.redHair, text: whim.redHair, is: { fact: hair, is: red } }
      - { id: whim.amber, text: whim.amber, is: { fact: ornament, is: amber } }
queue:
  count: [10, 12]
  teachFirst: arch.borrowed_blade
  scripted:
    # A shieldmaiden carried from the ford before she was quite dead (docs/tech-spec.md §60); she comes back on Day 15 if sent home.
    - { case: case.svanhild7, at: 5 }
  archetypes:
    - { id: arch.honest_warrior, w: 3 }
    - { id: arch.freyja_pick, w: 2 }
    - { id: arch.disarmed_warrior, w: 2 }
    - { id: arch.straw_braggart, w: 2 }
    - { id: arch.fled_coward, w: 2 }
    - { id: arch.not_quite_dead, w: 1 }
    - { id: arch.drowned_raider, w: 2 }
    - { id: arch.oathbreaker, w: 2 }
    - { id: arch.borrowed_blade, w: 3 }
    - { id: arch.ulfberht_braggart, w: 2 }
  mix: { VALHALLA: [15, 35], FOLKVANGR: [5, 20], HEL: [35, 55], RETURN: [5, 10], RAN: [10, 25] }
  knobs:
    lieRate: 100
    maxLies: 1
    decoyRate: 20
    ravenRate: 20
    forgetRate: 10
    proofCostS: [0, 50]
    maxTools: 2
    maxDocs: 4
    salienceFloor: 2
    spreadLines: true
    spreadLooks: true

# The coach's lesson for the day's first soul, which teaches what's new (docs/tech-spec.md §25).
lesson:
  steps:
    - { id: d7.lens, text: coach.d7.lens, focus: runeLens, until: { tool: runeLens } }
    - { id: d7.owner, text: coach.d7.owner, focus: hands, next: true }
    - { id: d7.stamp, text: coach.d7.stamp, focus: judge }
