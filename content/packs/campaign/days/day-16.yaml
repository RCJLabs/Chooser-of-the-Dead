# Day 16: liars forfeit the halls of the worthy. Caught in a lie, a soul they would take goes to Hel.
day: 16
sunS: 860
decree: decree.d16
scenes: { morning: scene.d16.morning, night: scene.d16.night }
economy:
  wage: 8
  docBonus: 1
  warnings: 2
  fines: [5, 10, 15]
  costs: { hearth: 31, food: 13, medicine: 26 }
params:
  freyjaWhim:
    pool:
      - { id: whim.leftHanded, text: whim.leftHanded, is: { fact: gripHand, is: left } }
      - { id: whim.redHair, text: whim.redHair, is: { fact: hair, is: red } }
      - { id: whim.amber, text: whim.amber, is: { fact: ornament, is: amber } }
  odinClaim:
    pool:
      - { id: whim.odin.scarred, text: whim.odin.scarred, is: { fact: woundsFront, gte: 2 } }
      - { id: whim.odin.ulfberht, text: whim.odin.ulfberht, is: { fact: blade, is: ulfberht } }
queue:
  count: [13, 15]
  teachFirst: arch.proud_liar
  scripted:
    # The one who fell at the pass at dawn, chosen in the morning's scene (docs/tech-spec.md §51, §78): Solveig's boy,
    # unless you chose your brother or Bera's man. Each one's `when` lets only one of them in.
    - { case: case.kari, at: 2 }
    - { case: case.ulf16, at: 2 }
    - { case: case.aslak, at: 2 }
    - { case: case.thorvald16, at: 6 }
  archetypes:
    - { id: arch.honest_warrior, w: 2 }
    - { id: arch.freyja_pick, w: 2 }
    - { id: arch.disarmed_warrior, w: 2 }
    - { id: arch.straw_braggart, w: 1 }
    - { id: arch.fled_coward, w: 1 }
    - { id: arch.not_quite_dead, w: 1 }
    - { id: arch.drowned_raider, w: 2 }
    - { id: arch.oathbreaker, w: 2 }
    - { id: arch.borrowed_blade, w: 2 }
    - { id: arch.ulfberht_braggart, w: 1 }
    - { id: arch.long_nails, w: 1 }
    - { id: arch.tally_forger, w: 2 }
    - { id: arch.coward_forger, w: 1 }
    - { id: arch.baptized, w: 2 }
    - { id: arch.prime_signed, w: 1 }
    - { id: arch.false_convert, w: 1 }
    - { id: arch.loki, w: 2 }
    - { id: arch.bedridden, w: 1 }
    - { id: arch.contested, w: 1 }
    - { id: arch.proud_liar, w: 3 }
  # Souls from one fight or one crew, together at the desk (docs/tech-spec.md §69).
  parties: { n: [1, 2] }
  mix: { VALHALLA: [10, 30], FOLKVANGR: [5, 20], HEL: [20, 45], RETURN: [5, 10], RAN: [5, 20], TRANSFER: [15, 35], DETAIN: [5, 12] }
  knobs:
    lieRate: 100
    maxLies: 1
    decoyRate: 20
    ravenRate: 20
    forgetRate: 20
    proofCostS: [0, 50]
    maxTools: 3
    maxDocs: 5
    salienceFloor: 1
    tallyRate: 40
    muninnRecall: 50
    huginnAside: 25
    spreadLines: true
    spreadLooks: true

# The coach's lesson for the day's first soul, which teaches what's new (docs/tech-spec.md §25).
lesson:
  steps:
    - { id: d16.catch, text: coach.d16.catch, focus: 'words compare', until: { flagged: true } }
    - { id: d16.stamp, text: coach.d16.stamp, focus: judge }
