# Day 18: no new rule, but the skalds cut tallies in kennings. Draupnir drips again; Naglfar is nearly built, and Loki
# makes his last offer.
day: 18
sunS: 900
decree: decree.d18
# Odin's day. He stops at the desk after the third soul (below), and at noon a raven brings word that he has changed
# his claim (docs/tech-spec.md §45, §59): from the day's ninth soul it's drawn again, never to the same one, and that
# soul is one both he and Freyja want under it. The raven comes two souls earlier.
noon: { at: 8, notice: 2, redraw: [odinClaim], text: decree.d18.noon, teach: arch.contested }
scenes: { morning: scene.d18.morning, night: scene.d18.night }
economy:
  wage: 8
  docBonus: 1
  warnings: 2
  fines: [5, 10, 15]
  costs: { hearth: 35, food: 14, medicine: 30 }
params:
  freyjaWhim:
    pool:
      - { id: whim.leftHanded, text: whim.leftHanded, is: { fact: gripHand, is: left } }
      - { id: whim.redHair, text: whim.redHair, is: { fact: hair, is: red } }
      - { id: whim.amber, text: whim.amber, is: { fact: ornament, is: amber } }
  odinClaim:
    pool:
      - { id: whim.odin.scarred, text: whim.odin.scarred, is: { fact: woundsFront, gte: 2 } }
      - { id: whim.odin.ulfberht, text: whim.odin.ulfberht, is: { fact: blade, is: ulfberht } }
queue:
  count: [14, 16]
  # The first soul brings a saga a skald cut, to teach kennings (docs/tech-spec.md §77).
  teachFirst: arch.skald_saga
  # Odin at the desk (docs/tech-spec.md §46), once three souls have been sent: early, so a slow day still has him.
  visits:
    - { scene: scene.d18.desk, at: 3 }
  archetypes:
    - { id: arch.honest_warrior, w: 2 }
    - { id: arch.freyja_pick, w: 2 }
    - { id: arch.disarmed_warrior, w: 2 }
    - { id: arch.straw_braggart, w: 1 }
    - { id: arch.fled_coward, w: 1 }
    - { id: arch.not_quite_dead, w: 1 }
    - { id: arch.drowned_raider, w: 2 }
    - { id: arch.skald_saga, w: 1 }
    - { id: arch.oathbreaker, w: 2 }
    - { id: arch.borrowed_blade, w: 2 }
    - { id: arch.ulfberht_braggart, w: 1 }
    - { id: arch.long_nails, w: 1 }
    - { id: arch.tally_forger, w: 2 }
    - { id: arch.coward_forger, w: 1 }
    - { id: arch.baptized, w: 2 }
    - { id: arch.prime_signed, w: 1 }
    - { id: arch.false_convert, w: 1 }
    - { id: arch.loki, w: 2 }
    - { id: arch.bedridden, w: 1 }
    - { id: arch.contested, w: 1 }
    - { id: arch.proud_liar, w: 2 }
    - { id: arch.spear_marked, w: 2 }
    - { id: arch.marked_boaster, w: 1 }
  # Souls from one fight or one crew, together at the desk (docs/tech-spec.md §69).
  parties: { n: [1, 2] }
  mix: { VALHALLA: [10, 30], FOLKVANGR: [5, 20], HEL: [20, 45], RETURN: [5, 10], RAN: [5, 20], TRANSFER: [15, 35], DETAIN: [5, 12] }
  knobs:
    lieRate: 100
    maxLies: 1
    decoyRate: 20
    ravenRate: 20
    forgetRate: 30
    proofCostS: [0, 50]
    maxTools: 3
    maxDocs: 5
    salienceFloor: 1
    tallyRate: 40
    # The skalds cut tallies in kennings (docs/tech-spec.md §77), and forgers faking their hand botch some.
    kennings: 60
    botch: 50
    muninnRecall: 50
    huginnAside: 25
    spreadLines: true
    spreadLooks: true

# The coach's lesson for the day's first soul, which teaches what's new (docs/tech-spec.md §25): kennings (§77).
lesson:
  steps:
    - { id: d18.tally, text: coach.d18.tally, focus: tally, next: true }
    - { id: d18.rules, text: coach.d18.rules, focus: rules, next: true }
    - { id: d18.judge, text: coach.d18.judge, focus: judge }
