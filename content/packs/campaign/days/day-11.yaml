# Day 11: forged tallies. Story (M7 draft): who is forging them.
day: 11
sunS: 720
decree: decree.d11
scenes: { morning: scene.d11.morning, night: scene.d11.night }
economy:
  wage: 8
  docBonus: 1
  warnings: 2
  fines: [5, 10, 15]
  costs: { hearth: 18, food: 8, medicine: 17 }
params:
  freyjaWhim:
    pool:
      - { id: whim.leftHanded, text: whim.leftHanded, is: { fact: gripHand, is: left } }
      - { id: whim.redHair, text: whim.redHair, is: { fact: hair, is: red } }
      - { id: whim.amber, text: whim.amber, is: { fact: ornament, is: amber } }
queue:
  count: [12, 14]
  # Freyja at the desk (docs/tech-spec.md §46, §59), once four souls have been sent.
  visits:
    - { scene: scene.d11.desk, at: 4 }
  teachFirst: arch.tally_forger
  archetypes:
    - { id: arch.honest_warrior, w: 3 }
    - { id: arch.freyja_pick, w: 2 }
    - { id: arch.disarmed_warrior, w: 2 }
    - { id: arch.straw_braggart, w: 1 }
    - { id: arch.fled_coward, w: 1 }
    - { id: arch.not_quite_dead, w: 1 }
    - { id: arch.drowned_raider, w: 2 }
    - { id: arch.oathbreaker, w: 2 }
    - { id: arch.borrowed_blade, w: 2 }
    - { id: arch.ulfberht_braggart, w: 1 }
    - { id: arch.long_nails, w: 1 }
    - { id: arch.tally_forger, w: 3 }
    - { id: arch.coward_forger, w: 2 }
    - { id: arch.baptized, w: 2 }
    - { id: arch.prime_signed, w: 1 }
    - { id: arch.false_convert, w: 1 }
  # Souls from one fight or one crew, together at the desk (docs/tech-spec.md §69).
  parties: { n: [1, 2] }
  mix: { VALHALLA: [10, 35], FOLKVANGR: [5, 20], HEL: [30, 55], RETURN: [5, 10], RAN: [5, 25], TRANSFER: [5, 15] }
  knobs:
    lieRate: 100
    maxLies: 1
    decoyRate: 20
    ravenRate: 20
    forgetRate: 10
    proofCostS: [0, 50]
    maxTools: 3
    maxDocs: 5
    salienceFloor: 2
    tallyRate: 40
    spreadLines: true
    spreadLooks: true

# The coach's lesson for the day's first soul, which teaches what's new (docs/tech-spec.md §25).
lesson:
  steps:
    - { id: d11.tally, text: coach.d11.tally, focus: tally, next: true }
    - { id: d11.lens, text: coach.d11.lens, focus: runeLens, until: { tool: runeLens } }
    - { id: d11.stamp, text: coach.d11.stamp, focus: judge }
