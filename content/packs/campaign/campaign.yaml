    member: { id: kormak, name: family.kormak, adult: true, ownKeep: true }
    scenes:
      - { day: 1, at: night, scene: scene.o.thrall.1 }
      - { day: 4, at: night, scene: scene.o.thrall.2 }
      - { day: 20, at: night, scene: scene.o.thrall.3 }
# Arms for the last battle (docs/tech-spec.md §56): from the night Muninn says Odin knows how it ends, the
# quartermaster sells arms for one front a night, each lot dearer than the last, each adding strength at its front.
# First guesses for the sims to tune. The words are DRAFT.
arms:
  from: 13
  strength: 6
  prices: [40, 60, 80, 100, 120, 140, 160]
  fronts:
    - { front: front.wolf, name: arms.wolf, text: arms.wolf.text }
    - { front: front.fire, name: arms.fire, text: arms.fire.text }
    - { front: front.gate, name: arms.gate, text: arms.gate.text }
    - { front: front.ship, name: arms.ship, text: arms.ship.text }
# Letters from home (docs/tech-spec.md §74): scenes played after the day's own (and the origin's), on the runs their
# `when` holds for. The household's errands are asked and answered in them: your mother's friend Oddny (asked on Night 6,
# at the desk on Day 7, answered that night) and Ulf's friend Steinar (Night 8, Day 10, Night 10); and on Night 14, what
# they say of you at home, read from the word among the dead (§73) and the souls you've sent wrong. DRAFT text.
letters:
  - { day: 6, at: night, scene: scene.e.oddny.ask, when: { state: member.mother.gone, lte: 0 } }
  - { day: 7, at: night, scene: scene.e.oddny.answer, when: { state: flags.oddny_judged, gte: 1 } }
  - { day: 8, at: night, scene: scene.e.steinar.ask, when: { state: member.brother.gone, lte: 0 } }
  - day: 10
    at: night
    scene: scene.e.steinar.answer
    when: { all: [{ state: flags.errand_steinar, gte: 1 }, { state: member.brother.gone, lte: 0 }] }
  - { day: 14, at: night, scene: scene.e.talk }
# Proven, not lucky (docs/tech-spec.md §76): a stamp is proven when what the player had of the soul as it was sent
# (what they looked at, the signs the body showed them, what it owned up to) settled its judgment. A day is Flawless
# only with every right stamp proven, and in an Endless run a right stamp on a guess scores this instead of its worth.
# Never in the Daily or the primer. First guess.
proven:
  luckyPoints: 0
# Vows at the cup (docs/tech-spec.md §75): from Night 3, each night offers three vows for the next day, drawn for the
# run and the day, and the player swears one or none. The day's audit settles it: kept, it pays its rings; broken, it
# costs Odin's standing, before whom it was sworn. A kept vow moves no standing, so vows can't carry a run to an ending.
# Never in Story Mode, and under the oath never the vow it makes pointless. The sun's vow says its share in words too.
# First guesses, about a soul's wage each; `pnpm sim campaign --vows` measures them. DRAFT text.
vows:
  from: 3
  offered: 3
  broken: { odin: -1 }
  list:
    - { id: vow.clean, kind: clean, since: 4, rings: 8, text: vow.clean }
    - { id: vow.liars, kind: liars, since: 4, rings: 8, text: vow.liars }
    - { id: vow.proven, kind: proven, since: 4, rings: 6, text: vow.proven }
    - { id: vow.silent, kind: silent, since: 4, rings: 3, text: vow.silent }
    - { id: vow.sun, kind: sun, since: 4, rings: 4, spare: 25, text: vow.sun }
    - { id: vow.alone, kind: alone, since: 4, rings: 2, text: vow.alone }
# The epilogue (docs/tech-spec.md §55): after the ending's own words, what became of everyone, read from how the run
# left them. Each slot says the first of its lines whose `when` holds (the last, without one, whatever else); a slot
# with none that holds says nothing. Not after a failure or the slice's end. Naglfar can sail on Day 18 or 19, before
# the horn, so lines that tell of the horn or the battle ask for Day 20. The words are DRAFT.
epilogue:
  draft: true
  when:
    all:
      - { state: ending.demoted, lte: 0 }
      - { state: ending.alone, lte: 0 }
      - { state: ending.sliceEnd, lte: 0 }
      - { state: ending.demoEnd, lte: 0 }
  slots:
    # Where the family was when the horn blew. The ship, the ferry and the wood endings tell it themselves.
    - id: epi.refuge
      section: home
      when:
        all:
          - { state: ending.naglfar, lte: 0 }
          - { state: ending.smuggled, lte: 0 }
          - { state: ending.rebirth, lte: 0 }
      lines:
        - { when: { state: flags.wood, gte: 1 }, text: epi.refuge.wood }
        # The ferry without the fare: the smuggled ending needs a hundred rings on the day.
        - { when: { state: flags.ferryman, gte: 1 }, text: epi.refuge.ferry }
        - when: { all: [{ state: flags.loki_deal, gte: 1 }, { state: front.ship, gte: 1 }] }
          text: epi.refuge.shipTurned
        - { when: { state: flags.loki_deal, gte: 1 }, text: epi.refuge.ship }
        - { when: { state: flags.stay_home, gte: 1 }, text: epi.refuge.home }
        # The deal rubbed out on the last payday, with no night left to plan another.
        - { when: { state: flags.broke_loki, gte: 1 }, text: epi.refuge.broke }
        - { text: epi.refuge.none }
    - id: epi.ragna
      section: home
      lines:
        - when: { all: [{ state: member.mother.died, gte: 1 }, { state: flags.ragna_refused, gte: 1 }] }
          text: epi.ragna.crossed
        - { when: { state: member.mother.died, gte: 1 }, text: epi.ragna.died }
        - { when: { state: flags.ragna_hill, gte: 1 }, text: epi.ragna.hill }
        - { when: { state: member.mother.sick, gte: 1 }, text: epi.ragna.sick }
        - { text: epi.ragna.well }
    - id: epi.ulf
      section: home
      lines:
        # Chosen at the pass on Day 16 (docs/tech-spec.md §78), and where you sent him.
        - when: { all: [{ state: flags.chose_ulf, gte: 1 }, { state: flags.ulf_valhalla, gte: 1 }, { state: day, gte: 20 }] }
          text: epi.ulf.pass.rode
        - when: { all: [{ state: flags.chose_ulf, gte: 1 }, { state: flags.ulf_valhalla, gte: 1 }] }
          text: epi.ulf.pass.benches
        - { when: { state: flags.chose_ulf, gte: 1 }, text: epi.ulf.pass }
        - { when: { state: member.brother.died, gte: 1 }, text: epi.ulf.died }
        - { when: { state: flags.ulf_levy, gte: 1 }, text: epi.ulf.levy }
        - { when: { state: flags.ulf_stayed, gte: 1 }, text: epi.ulf.stayed }
        - { when: { state: flags.ulf_shipyard, gte: 1 }, text: epi.ulf.shipyard }
        - { when: { state: flags.ulf_debt, gte: 1 }, text: epi.ulf.debt }
        - { text: epi.ulf.home }
    # Solveig's boy, home from the pass because you chose another at dawn (docs/tech-spec.md §78).
    - id: epi.levy
      section: home
      lines:
        - { when: { state: flags.chose_ulf, gte: 1 }, text: epi.levy.ulf }
        - { when: { state: flags.chose_aslak, gte: 1 }, text: epi.levy.aslak }
    # Asa is a child: she can fall ill or go to relatives, never die (docs/build-plan.md §1).
    - id: epi.asa
      section: home
      lines:
        - { when: { state: member.sister.left, gte: 1 }, text: epi.asa.left }
        - { when: { state: member.sister.sick, gte: 1 }, text: epi.asa.sick }
        # Four nights of letters (1, 4, 7 and 11): three or more of one kind is how the letters read.
        - { when: { state: flags.letters_honest, gte: 3 }, text: epi.asa.honest }
        - { when: { state: flags.letters_kind, gte: 3 }, text: epi.asa.kind }
        - { text: epi.asa.home }
    # The household's errands at the desk (docs/tech-spec.md §74): what came of your mother's favour, and of Ulf's.
    - id: epi.oddny
      section: home
      lines:
        - { when: { state: flags.oddny_meadow, gte: 1 }, text: epi.oddny.meadow }
        - { when: { state: flags.oddny_hel, gte: 1 }, text: epi.oddny.hel }
    - id: epi.steinar
      section: home
      when: { state: flags.errand_steinar, gte: 1 }
