# The full campaign's part: Days 4-20 on top of the demo's Days 1-3 (docs/m7-design.md).
# Numbers are first guesses for `pnpm sim campaign` to tune. DRAFT text.
lastDay: 20
finale: ending.lastStand
# Oathbreakers sent to Valhalla will run at Ragnarök: they don't count as worthy einherjar.
worthy: pred.einherjar
# Only mistakes move standing (see the audit). These add to the demo's rows: a deliberate mistake can
# please the god who gains the soul, and letting Loki go pleases Loki.
standing:
  - { expected: VALHALLA, stamped: HEL, fx: { odin: -1, hel: 1 } }
  - { expected: VALHALLA, stamped: TRANSFER, fx: { odin: -1, clerk: 1 } }
  - { expected: HEL, stamped: TRANSFER, fx: { hel: -1, clerk: 1 } }
  - { expected: TRANSFER, stamped: HEL, fx: { clerk: -1, hel: 1 } }
  - { expected: TRANSFER, stamped: '*', fx: { clerk: -1 } }
  - { expected: DETAIN, stamped: '*', fx: { odin: -2, loki: 2 } }
# The gods' requests (docs/tech-spec.md §42): on some mornings a god asks, openly, for souls that belong to
# another. Doing it in full earns the reward, on top of the rows above; each soul is still sent wrong (no
# wage, a citation, a fine past the day's warnings). Declining costs nothing. Freyja and Hel both want Odin's
# warriors, so they can be rivals for them. The rows do most of the moving: a favour of Freyja's moves her 3
# (2 souls and the reward), which with her ending at 8 is what a bot devoted to her in the story still lacks
# (docs/tech-spec.md §42). First guesses; `pnpm sim campaign --serve <god>` measures them.
# They begin on Day 5, the day after Freyja's stamp, so Day 4 teaches her stamp alone (docs/tech-spec.md §57).
requests:
  from: 5
  chance: 50
  rivals: 25
  list:
    - { id: req.freyja, god: freyja, from: VALHALLA, to: FOLKVANGR, n: 2, reward: { freyja: 1 }, since: 5, text: request.freyja }
    - { id: req.odin, god: odin, from: FOLKVANGR, to: VALHALLA, n: 1, reward: { odin: 1 }, since: 5, text: request.odin }
    - { id: req.hel, god: hel, from: VALHALLA, to: HEL, n: 2, reward: { hel: 1 }, since: 5, text: request.hel }
    - { id: req.clerk, god: clerk, from: HEL, to: TRANSFER, n: 2, reward: { clerk: 1 }, since: 10, text: request.clerk }
# Pleas from ordinary souls (docs/tech-spec.md §59): on half the days from Day 7, one of the day's own souls asks, openly,
# for a hall where it doesn't belong, as Kari does on Day 16 (§51). The stamp is the answer. Granted, it's a mistake all
# the same (no wage, a citation, a fine past the day's warnings, the standing any such mistake moves), but the soul
# stands at Ragnarök in the hall it asked for instead of running from it, and doesn't appeal. Never a story soul, the
# day's teaching soul or one who waited through the night, and never on a day a story soul in the line pleads or kin
# have come (§60). DRAFT text.
pleas:
  from: 7
  chance: 50
  list:
    - { from: HEL, to: VALHALLA, text: plea.hel.valhalla }
    - { from: HEL, to: RAN, text: plea.hel.ran }
    - { from: VALHALLA, to: HEL, text: plea.valhalla.hel }
    - { from: VALHALLA, to: FOLKVANGR, text: plea.valhalla.folkvangr }
    - { from: RAN, to: VALHALLA, text: plea.ran.valhalla }
    - { from: TRANSFER, to: HEL, text: plea.transfer.hel, since: 10 }
# Word among the dead (docs/tech-spec.md §73): the line talks about how merciful you are. Each soul's ask granted at the
# audit (a plea, the kin's included, or rings offered for a stamp, the story's included) moves the word a step softer,
# and each refused (the soul sent where it belongs) a step sterner, from -3 to 3; a third hall moves it neither way.
# From the next day on, its level sets how often one of the day's own souls asks (instead of the pleas' chance), and
# how often the day's souls lie (a share of each day's lie rate); on the softest, half of those who ask bring rings
# instead of a plea. Only a soul whose lies can all be caught at the desk asks. One that asks and lies too is asking
# falsely: granted, it doesn't stand where it asked to go but runs at the last battle, and two mornings later the
# dead find it out and the word goes a step softer again. At 0, as the campaign was before the word. First guesses;
# DRAFT text.
word:
  max: 3
  levels:
    - { id: word.stern, upTo: -2, asks: 25, lies: 85, name: word.stern, text: word.stern.text }
    - { id: word.even, upTo: 1, asks: 50, lies: 100, name: word.even, text: word.even.text }
    - { id: word.soft, asks: 75, lies: 115, offers: 50, name: word.soft, text: word.soft.text }
  # Offers for a stamp where the soul doesn't belong, from a hall whose souls plead: paid at the audit, and a mistake
  # all the same, with its usual costs (no wage, a citation, a fine past the day's warnings, the standing it moves).
  # Unlike a plea granted, the soul runs at the last battle: it bought the hall, it didn't want it. It doesn't appeal.
  offers:
    - { from: HEL, to: VALHALLA, rings: 15 }
    - { from: HEL, to: FOLKVANGR, rings: 12 }
    - { from: RAN, to: VALHALLA, rings: 15 }
    - { from: TRANSFER, to: VALHALLA, rings: 12, since: 10 }
  found: { after: 2, text: word.found }
# The kin of the misjudged (docs/tech-spec.md §60): from Day 8, when a soul was sent to a hall where it didn't belong
# at least two days before, on some days one of the day's own souls is its husband, wife or cousin, and says so at
# the desk. If that soul's hall isn't where this one belongs, it asks to be sent there too: a plea (§59), and granted,
# it stands there at Ragnarök. A soul's kin come once. DRAFT text.
kin:
  from: 8
  chance: 40
  after: 2
  text: kin.text
  plea: kin.plea
# Favour (docs/tech-spec.md §43): at the gate each morning, every god whose standing is at a favour's mark grants
# it for the day and its night, and a god's favours add up. Like the upgrades, favours give time, information or
# money, never what decides a soul. The first come at 4, or at 3 for the two that ease hardship (sickness and
# fines); bots that court a god (its story and every request) hold them on a quarter to three quarters of their
# mornings, and those that don't, on up to a quarter (Hel's, for experts). The second come at 8, Freyja's and
# Hel's endings' mark: a fifth to two fifths of a courting expert's mornings, and never by accident. First guesses.
favours:
  - { id: fav.odin, faction: odin, at: 4, effect: { sunS: 60 }, text: favour.odin }
  - { id: fav.odin.more, faction: odin, at: 8, effect: { sunS: 60 }, text: favour.odin.more }
  - { id: fav.freyja, faction: freyja, at: 4, effect: { freeQuestions: 1 }, text: favour.freyja }
  - { id: fav.freyja.more, faction: freyja, at: 8, effect: { freeQuestions: 1 }, text: favour.freyja.more }
  - { id: fav.hel, faction: hel, at: 3, effect: { sickNights: 1, sickChancePct: 0 }, text: favour.hel }
  - { id: fav.hel.more, faction: hel, at: 8, effect: { sickNights: 1 }, text: favour.hel.more }
  - { id: fav.clerk, faction: clerk, at: 3, effect: { finePct: 50 }, text: favour.clerk }
  - { id: fav.clerk.more, faction: clerk, at: 8, effect: { finePct: 0 }, text: favour.clerk.more }
  # Loki's (docs/tech-spec.md §57): a ring a nail for each soul sent on with its nails long, the ship's price, paid at
  # the audit. Each is still a mistake, with its citation, its fine past the day's warnings and no wage; the ring a nail
  # about makes up the wage. Bots that take his deal hold the first on two fifths of their mornings, from Day 13 or so.
  - { id: fav.loki, faction: loki, at: 4, effect: { nailRings: 10 }, text: favour.loki }
  - { id: fav.loki.more, faction: loki, at: 8, effect: { nailRings: 10 }, text: favour.loki.more }
# Promotion (docs/tech-spec.md §44): two clean days in a row (every soul judged rightly, none left at dusk)
# bring the next rank's offer the next morning. A rank brings souls more each day (after the day's own), fewer
# mistakes forgiven before the fines, a higher wage and a tithe to Odin each night. Declining costs nothing, and
# a rank can be stepped down from at night (tonight's tithe is still owed). With +2 and +3 a soul and tithes of
# 6 and 14, promoted expert bots ended far richer (1,753 rings against 764); these leave them at 1,039 with a
# host a fifth stronger, and competent bots even. First guesses; `pnpm sim campaign --promote` measures them.
# The first offer can come on Day 6, after Freyja's stamp and the first requests have had a day each (§57).
promotion:
  from: 6
  cleanDays: 2
  ranks:
    - { id: rank.second, name: rank.second, text: rank.second.text, souls: 2, warnings: -1, wage: 1, tithe: 20 }
    - { id: rank.first, name: rank.first, text: rank.first.text, souls: 4, warnings: -2, wage: 2, tithe: 45 }
# The Norns' weave (docs/tech-spec.md §53): once a run has reached one of these endings on the device, a new run can
# be begun woven. It draws one weave from its seed: the same rules, one of them read at another place in the Order
# of Judgment, so where two rules both hold, the other decides. The morning of the first day it changes says so, and
# the rulebook reads in its order. DRAFT text.
weaving:
  after: [ending.naglfar, ending.rebirth, ending.smuggled, ending.transfer, ending.hel, ending.freyja, ending.odin, ending.wolf, ending.lastStand]
  # Each weave also brings two souls a day, from its first, that both of the rules it reorders claim, in place of two
  # of the day's own: without them, it would decide one soul in thirty or fewer.
  weaves:
    # Rán's rule before the registry's and the clerk's: drowned outlaws (from Day 6) and the drowned baptized
    # (from Day 10) are hers.
    - id: weave.sea
      name: weave.sea
      text: weave.sea.text
      order: { rule.ran: 150 }
      souls: [{ kind: arch.baptized, to: [RAN], n: 2, since: 10 }]
    # The clerk's rule after every hall's but Hel's: the baptized are his only when nothing else claims them, so a
    # baptized warrior who fell well is Odin's or Freyja's, and one who drowned is Rán's (from Day 10).
    - id: weave.clerkLast
      name: weave.clerkLast
      text: weave.clerkLast.text
      order: { rule.transfer: 900 }
      souls:
        - { kind: arch.baptized, to: [VALHALLA, FOLKVANGR], n: 1 }
        - { kind: arch.baptized, to: [RAN], n: 1 }
    # Freyja's rule before Odin's claim (docs/tech-spec.md §59): from Day 15, when both want the same worthy soul, her
    # whim wins, where the day's rule says his claim does.
    - id: weave.freyjaFirst
      name: weave.freyjaFirst
      text: weave.freyjaFirst.text
      order: { rule.folkvangr: 585 }
      souls: [{ kind: arch.contested, to: [FOLKVANGR], n: 2 }]
# Day events (docs/tech-spec.md §52): each run draws three as it begins, from its seed, on three of Days 5-18,
# never two days running (nor on a day with a noon decree). An event changes the day's line (the last of its own
# souls don't come, and the event's come among the rest), its sun, and that night's bills and sickness; never the
# day's rules. Its souls are made and judged as any day's are. First guesses; `pnpm sim campaign` measures them.
# DRAFT text.
events:
  perRun: 3
  from: 5
  to: 18
  pool:
    # More of the drowned in the line, and a darker day.
    - id: event.storm
      since: 5
      name: event.storm
      text: event.storm.text
      sunPct: 90
      fewer: 3
      souls: [{ kind: arch.drowned_raider, to: [RAN], n: 3 }]
    # More who died in their beds: Hel's, or from Day 14, when her hall is full, the clerk's. At night anyone well at
    # home may catch it, bills paid or not; Hel's favour eases it as it eases any chance of falling sick.
    - id: event.sickness
      since: 5
      name: event.sickness
      text: event.sickness.text
      fewer: 2
      souls:
        - { kind: arch.straw_braggart, to: [HEL], n: 2, until: 14 }
        - { kind: arch.bedridden, to: [TRANSFER], n: 2, since: 14 }
      sickChance: 20
    # Three more souls from the ford, and more sun to judge them by.
    - id: event.battle
      since: 5
      name: event.battle
      text: event.battle.text
      sunPct: 115
      souls:
        - { kind: arch.honest_warrior, to: [VALHALLA], n: 1 }
        - { kind: arch.disarmed_warrior, to: [HEL], n: 1 }
        - { kind: arch.fled_coward, to: [HEL], n: 1 }
    # The jarl's feast: fewer souls, and the family eats at his hall tonight.
    - id: event.feast
      since: 5
      name: event.feast
      text: event.feast.text
      fewer: 3
      costsPct: { food: 0 }
    # A hard frost in the deep of the winter (docs/tech-spec.md §59): less sun to judge by, and the hearth at home
    # burns half as much wood again that night.
    - id: event.frost
      since: 10
      name: event.frost
      text: event.frost.text
      sunPct: 85
      costsPct: { hearth: 150 }
    # The jarl's men hunt the outlaws in the hills (§59): three outlaws in the line, in place of three of the day's own.
    - id: event.outlaws
      since: 6
      name: event.outlaws
      text: event.outlaws.text
      fewer: 3
      souls: [{ kind: arch.oathbreaker, to: [HEL], n: 3 }]
# Speed only (docs/build-plan.md §1): cheaper tools and questions, more sun.
shop:
  - { id: up.sundial, name: shop.sundial, text: shop.sundial.text, price: 25, since: 4, effect: { sunS: 30 } }
  - { id: up.registryIndex, name: shop.registryIndex, text: shop.registryIndex.text, price: 20, since: 6, effect: { tool: registry, costS: 2 } }
  - { id: up.lensPolish, name: shop.lensPolish, text: shop.lensPolish.text, price: 30, since: 7, effect: { tool: runeLens, costS: 4 } }
  - { id: up.whetstone, name: shop.whetstone, text: shop.whetstone.text, price: 20, since: 8, effect: { tool: clippers, costS: 1 } }
  - { id: up.hornOfBrass, name: shop.hornOfBrass, text: shop.hornOfBrass.text, price: 35, since: 12, effect: { questionS: 10 } }
  - { id: up.waterClock, name: shop.waterClock, text: shop.waterClock.text, price: 40, since: 15, effect: { sunS: 60 } }
  # The late winter's sinks (M7.7): a competent player otherwise banks everything from Day 13 on.
  - { id: up.goldFeather, name: shop.goldFeather, text: shop.goldFeather.text, price: 40, since: 13, effect: { tool: feather, costS: 3 } }
  - { id: up.whaleLamp, name: shop.whaleLamp, text: shop.whaleLamp.text, price: 50, since: 16, effect: { sunS: 45 } }
  - { id: up.runeTable, name: shop.runeTable, text: shop.runeTable.text, price: 40, since: 17, effect: { tool: runeLens, costS: 2 } }
  - { id: up.silverHorn, name: shop.silverHorn, text: shop.silverHorn.text, price: 45, since: 18, effect: { questionS: 6 } }
# The vertical slice (M5): Days 1-3, then nine days pass and Day 12 is
# played, to prove the late game. What the skipped days bring (rings earned,
# standing, Ulf's new work in the north) is a guess. DRAFT.
slice:
  after: 3
  day: 12
  finale: ending.sliceEnd
  preset:
    rings: 30
    standing: { odin: 1, freyja: 1, clerk: 1 }
    flags: { slice: 1, ulf_shipyard: 1 }
# Checked every night, lowest order first; the demo's demoted (10) and alone (20) come before these.
# Faction endings wait for Ragnarök (Day 20's night); Naglfar can sail from Day 18.
# The last battle (docs/tech-spec.md §54): after the last night, the hosts go to the fronts, in the order the player
# sets. A host is the souls sent to one hall: at its own front each soul sent there rightly counts 2, and each sent
# there by mistake (to Valhalla, the unworthy) breaks and runs, costing it 1; anywhere else a soul counts 1. The
# drowned fight only at sea. The foes are tuned on the campaign sims: experts hold all four about half the time, a
# competent run three (with a choice of which to lose), a novice's one. The words are DRAFT.
ragnarok:
  text: ragnarok.text
  hosts:
    - { id: host.einherjar, name: host.einherjar, hall: VALHALLA, front: front.wolf }
    - { id: host.freyja, name: host.freyja, hall: FOLKVANGR, front: front.fire }
    - { id: host.hel, name: host.hel, hall: HEL, front: front.gate }
    - { id: host.ran, name: host.ran, hall: RAN, front: front.ship, only: true }
  fronts:
    # A fifth stronger than first set (docs/tech-spec.md §58): with arms, the best choosers held every front every time.
    - { id: front.wolf, name: front.wolf, text: front.wolf.text, held: front.wolf.held, fell: front.wolf.fell, foe: 120 }
    - { id: front.fire, name: front.fire, text: front.fire.text, held: front.fire.held, fell: front.fire.fell, foe: 84 }
    - { id: front.gate, name: front.gate, text: front.gate.text, held: front.gate.held, fell: front.gate.fell, foe: 156 }
    # Naglfar's crew: every soul sent on with its nails long is one more aboard.
    - { id: front.ship, name: front.ship, text: front.ship.text, held: front.ship.held, fell: front.ship.fell, foe: 42, perNail: 2 }
  # The chooser rides out too, to the one front the player picks, and is worth this much there (§58).
  ride: { strength: 15 }
endings:
  - id: ending.naglfar
    order: 100
    when: { all: [{ state: day, gte: 18 }, { state: flags.loki_deal, gte: 1 }, { state: naglfar, gte: 10 }] }
    title: ending.naglfar.title
    text: ending.naglfar.text
  - id: ending.rebirth
    order: 200
    when: { all: [{ state: day, gte: 20 }, { state: flags.wood, gte: 1 }, { state: flags.truth, gte: 3 }, { state: front.fire, gte: 1 }, { state: fronts, gte: 3 }, { state: family.home, gte: 1 }] }
    title: ending.rebirth.title
    text: ending.rebirth.text
  - id: ending.smuggled
    order: 300
    when: { all: [{ state: day, gte: 20 }, { state: flags.ferryman, gte: 1 }, { state: rings, gte: 100 }, { state: family.home, gte: 1 }] }
    title: ending.smuggled.title
    text: ending.smuggled.text
  - id: ending.transfer
    order: 400
    when: { all: [{ state: day, gte: 20 }, { state: flags.clerk_contract, gte: 1 }, { state: standing.clerk, gte: 4 }] }
    title: ending.transfer.title
    text: ending.transfer.text
  # Freyja's and Hel's endings take a run's courting (docs/tech-spec.md §42): at 8, a bot devoted to either in
  # the story comes short without her requests (0 and 2 runs of 12, expert), and reaches it with one (12 and 11).
  - id: ending.hel
    order: 500
    when: { all: [{ state: day, gte: 20 }, { state: lead.hel, gte: 1 }, { state: standing.hel, gte: 8 }, { state: front.gate, gte: 1 }] }
    title: ending.hel.title
    text: ending.hel.text
  - id: ending.freyja
    order: 510
    when: { all: [{ state: day, gte: 20 }, { state: lead.freyja, gte: 1 }, { state: standing.freyja, gte: 8 }, { state: front.fire, gte: 1 }] }
    title: ending.freyja.title
    text: ending.freyja.text
  - id: ending.odin
    order: 520
    when: { all: [{ state: day, gte: 20 }, { state: lead.odin, gte: 1 }, { state: front.wolf, gte: 1 }] }
    title: ending.odin.title
    text: ending.odin.text
  - id: ending.wolf
    order: 990
    when: { all: [{ state: day, gte: 20 }, { state: fronts, lte: 1 }] }
    title: ending.wolf.title
    text: ending.wolf.text
  - { id: ending.lastStand, order: 1000, title: ending.lastStand.title, text: ending.lastStand.text }
  - { id: ending.sliceEnd, order: 1001, title: ending.sliceEnd.title, text: ending.sliceEnd.text }
# The journal's list of what's still in play (docs/story-drafts.md, "The journal"), in this order,
# each while its `when` holds. They name nobody the story hasn't named yet. The texts are DRAFT.
threads:
  - { id: thread.owesSkogul, when: { state: flags.owes_skogul, gte: 1 }, text: thread.owesSkogul }
  - id: thread.ulfDebt
    when: { all: [{ state: flags.ulf_debt, gte: 1 }, { state: flags.ulf_shipyard, lte: 0 }, { state: member.brother.gone, lte: 0 }] }
    text: thread.ulfDebt
  - { id: thread.ulfShipyard, when: { state: flags.ulf_shipyard, gte: 1 }, text: thread.ulfShipyard }
  - { id: thread.lokiDeal, when: { state: flags.loki_deal, gte: 1 }, text: thread.lokiDeal }
  - { id: thread.ferry, when: { state: flags.ferryman, gte: 1 }, text: thread.ferry }
  - id: thread.woodKnown
    when: { all: [{ state: flags.wood_known, gte: 1 }, { state: flags.wood, lte: 0 }] }
    text: thread.woodKnown
  - { id: thread.wood, when: { state: flags.wood, gte: 1 }, text: thread.wood }
  - { id: thread.stayHome, when: { state: flags.stay_home, gte: 1 }, text: thread.stayHome }
  # The household's errands at the desk (docs/tech-spec.md §74), until the soul is judged.
  - id: thread.oddny
    when: { all: [{ state: flags.errand_oddny, gte: 1 }, { state: flags.oddny_judged, lte: 0 }] }
    text: thread.oddny
  - id: thread.steinar
    when:
      all:
        - { state: flags.errand_steinar, gte: 1 }
        - { state: flags.steinar_judged, lte: 0 }
        - { state: flags.steinar_back, lte: 0 }
    text: thread.steinar
  - { id: thread.clerkContract, when: { state: flags.clerk_contract, gte: 1 }, text: thread.clerkContract }
  - { id: thread.truth, when: { state: flags.truth, gte: 1 }, text: thread.truth, count: flags.truth }
  # The forger's trail (docs/tech-spec.md §71), while the carver can still be named.
  - id: thread.carver
    when: { all: [{ state: flags.hunt_carver, gte: 1 }, { state: trail.night, lte: 0 }, { state: day, lte: 14 }] }
    text: thread.carver
# The forger's trail (docs/tech-spec.md §71): one of three carvers, drawn for the run, cuts every forged tally from
# Day 11, and his knife has two of the three habits a forgery can show; no two carvers share both. What the chooser
# sees under the lens, and in Muninn's gaps, is pinned to a board. Once the Night 11 letter asks for his name, he can
# be named on Night 12 or 14, once: the jarl's men drown the man named, whoever he is. The words are DRAFT.
trail:
  since: 11
  when: { state: flags.hunt_carver, gte: 1 }
  nights: [12, 14]
  suspects:
    - id: bjarni
      look: { gender: m, name: Bjarni, patronym: Sveinsson, age: 68, build: lean, beard: braided }
      hands: [elderRune, brokenFormula]
      text: trail.bjarni
    - id: hjalti
      look: { gender: m, name: Hjalti, patronym: Brandsson, age: 41, build: broad, beard: short }
      hands: [elderRune, mirroredRune]
      text: trail.hjalti
    - id: ljot
      look: { gender: m, name: Ljot, patronym: Ormsson, age: 55, build: heavy, beard: long }
      hands: [mirroredRune, brokenFormula]
      text: trail.ljot
  right: [{ flag: reported_carver }, { standing: odin, by: 1 }, { rings: 15 }]
  wrong: [{ flag: carver_wrong }, { standing: odin, by: -1 }]
  title: trail.title
  intro: trail.intro
  named: { right: trail.named.right, wrong: trail.named.wrong }
# Who the chooser was in life (docs/tech-spec.md §72), picked for a new run of the full game. Each origin's perk only
# ever changes speed or money (docs/roadmap.md): a speed perk each, or the trader's money. Each brings someone to live
# with the family, who keeps themselves while well (ownKeep): off the food bill, but sick, one more to feed and to buy
# medicine for, and an adult, who can die. And each has three scenes, played after the night's own: a first letter, a
# choice, and the last night. The numbers are first guesses; the sims can't weigh speed. The words are DRAFT.
origins:
  - id: shieldmaiden
    name: origin.shieldmaiden
    text: origin.shieldmaiden.text
    perk: { tools: [{ tool: flip, costS: 0 }, { tool: feather, costS: 4 }] }
    member: { id: thurid, name: family.thurid, adult: true, ownKeep: true }
    scenes:
      - { day: 1, at: night, scene: scene.o.shieldmaiden.1 }
      - { day: 7, at: night, scene: scene.o.shieldmaiden.2 }
      - { day: 20, at: night, scene: scene.o.shieldmaiden.3 }
  - id: seeress
    name: origin.seeress
    text: origin.seeress.text
    perk: { freeQuestions: 2 }
    member: { id: heid, name: family.heid, adult: true, ownKeep: true }
    scenes:
      - { day: 1, at: night, scene: scene.o.seeress.1 }
      - { day: 14, at: night, scene: scene.o.seeress.2 }
      - { day: 20, at: night, scene: scene.o.seeress.3 }
  - id: trader
    name: origin.trader
    text: origin.trader.text
