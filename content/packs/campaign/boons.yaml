# Endless's boons and curses (docs/tech-spec.md §68): before each round after the first, one of three boons, or the
# curse on offer, which makes every soul judged rightly after it worth one more. Only the full game has them; the demo's
# Endless plays as before.
# None touches a soul: they change the strikes a run can take, its score, its help (hints, presses) and its sun. The
# schema allows nothing else. `since` is the first day whose rules a round must bring; `max` how often one run may take
# it (no limit when absent); `needs: sun` only once a curse has brought the sun, `needs: strike` only after a strike.
# The numbers are guesses until players have run it. DRAFT text.
- { id: boon.shield, kind: boon, name: boon.shield.name, text: boon.shield.text, since: 1, max: 1, effect: { strikes: 1 } }
- { id: boon.mending, kind: boon, name: boon.mending.name, text: boon.mending.text, since: 1, max: 2, needs: strike, effect: { strikes: 1 } }
