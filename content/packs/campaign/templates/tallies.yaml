# A skald's tally (Day 18 on, docs/tech-spec.md §77): the same deeds in kennings and sayings, each on the rulebook's
# page, and carved plainly where a skald has no other way. A forger faking a skald's hand may botch a battle kenning,
# mixing up two from the page. DRAFT words.
- id: tl.k.battle.storm
  asserts: { fact: cause, value: battle }
  msg: tl.k.battle.storm
  params: { place: pool.places }
  skald: true
  kenning: k.odinsStorm
  botched: [tl.k.battle.storm.x]
