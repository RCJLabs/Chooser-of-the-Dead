- id: q.oath.confess
  on: { fact: outlaw, claimed: false, truth: [true], kind: confess }
  msgs: [q.oath.confess.1, q.oath.confess.2]
- id: q.oath.excuse
  on: { fact: outlaw, kind: excuse }
  msgs: [q.oath.excuse.1]
- id: q.owner.confess
  on: { fact: weaponOwner, claimed: self, truth: [other], kind: confess }
  msgs: [q.owner.confess.1]
- id: q.blade.confess
  on: { fact: blade, claimed: ulfberht, truth: [fakeUlfberht], kind: confess }
  msgs: [q.blade.confess.1]
- id: q.blade.plain.confess
  on: { fact: blade, claimed: ulfberht, truth: [plain], kind: confess }
  msgs: [q.blade.plain.confess.1]
# A forger questioned about the tally: one story or the other, never both.
- { id: q.tally.confess, on: { fact: '*', kind: confess, via: tally }, msgs: [q.tally.confess.1] }
- { id: q.tally.confess.brother, on: { fact: '*', kind: confess, via: tally }, msgs: [q.tally.confess.2] }
- { id: q.tally.excuse, on: { fact: '*', kind: excuse, via: tally }, msgs: [q.tally.excuse.1] }
- id: q.creed.hid.confess
  on: { fact: faith, claimed: heathen, truth: [baptized], kind: confess }
  msgs: [q.creed.hid.confess.1]
- id: q.creed.claimed.confess
  on: { fact: faith, claimed: baptized, truth: [heathen], kind: confess }
  msgs: [q.creed.claimed.confess.1]
- id: q.creed.excuse
  on: { fact: faith, kind: excuse }
  msgs: [q.creed.excuse.1]
# Loki never confesses. He answers a question with a better one.
- id: q.guise.deflect
  on: { fact: trickster, kind: deflect }
  msgs: [q.guise.deflect.1]
- id: q.guise.deflect.braggart
  on: { fact: trickster, kind: deflect, persona: [braggart] }
  msgs: [q.guise.deflect.2]
- { id: q.any.deflect, on: { fact: '*', kind: deflect }, msgs: [q.any.deflect.1] }
# A soul caught lying about a companion (docs/tech-spec.md §69): it owns up, or blames the dark. `{companion}` is who
# it lied about.
- { id: q.party.confess, on: { fact: '*', kind: confess, about: true }, msgs: [q.party.confess.1] }
- id: q.party.fled.cover.confess
  on: { fact: fled, claimed: false, kind: confess, about: true }
  msgs: [q.party.fled.cover.confess.1]
- id: q.party.fled.spite.confess
  on: { fact: fled, claimed: true, kind: confess, about: true }
  msgs: [q.party.fled.spite.confess.1]
- id: q.party.grip.cover.confess
  on: { fact: grip, claimed: weapon, kind: confess, about: true }
  msgs: [q.party.grip.cover.confess.1]
- id: q.party.grip.spite.confess
  on: { fact: grip, claimed: none, kind: confess, about: true }
  msgs: [q.party.grip.spite.confess.1]
- id: q.party.cause.confess
  on: { fact: cause, kind: confess, about: true }
  msgs: [q.party.cause.confess.1]
- { id: q.party.excuse, on: { fact: '*', kind: excuse, about: true }, msgs: [q.party.excuse.1] }
- id: q.party.coward.excuse
  on: { fact: '*', kind: excuse, persona: [coward], about: true }
  msgs: [q.party.coward.excuse.1]
