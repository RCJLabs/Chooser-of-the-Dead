# DRAFT writing (game phase 12, docs/tech-spec.md §78). Day 16, if you chose him at the pass at dawn (`chose_aslak`):
# Aslak Thorbrandsson, Bera's man, who held the same pass thirty winters ago. He died there at sunrise, spear in hand,
# wound in front, and belongs in Valhalla. He asks for nothing. Solveig's boy came home because of him.
id: case.aslak
personas: [veteran]
truth:
  alive: { is: false }
  cause: { is: battle }
  grip: { is: weapon }
  weaponOwner: { is: self }
  blade: { is: plain }
  woundsFront: { is: 1 }
  woundsBack: { is: 0 }
  outlaw: { is: false }
  faith: { is: heathen }
  trickster: { is: false }
  nailsGrown: { is: false }
  gripHand: { is: right }
  hair: { is: grey }
  ornament: { is: none }
lies: []
look: { gender: m, name: Aslak, patronym: Thorbrandsson, age: 66, build: lean, beard: long }
lines: [case.aslak.pass, case.aslak.boy, case.aslak.porridge]
words: { pool.weapons: spear }
expect: VALHALLA
when: { state: flags.chose_aslak, gte: 1 }
onStamp:
  - { stamped: '*', effects: [{ flag: aslak_judged }] }
  - { stamped: VALHALLA, effects: [{ flag: aslak_valhalla }] }
