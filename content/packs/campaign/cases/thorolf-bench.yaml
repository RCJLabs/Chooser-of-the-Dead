# DRAFT writing (docs/tech-spec.md §60). Day 17, if you took Jarl Asgaut's thirty rings on Day 9 (jarl_bribe): his son,
# Thorolf, killed holding the ford, spear in hand. He belongs in Valhalla, and knows what his father paid for his own
# bench. The same soul as case.thorolf_hel; only what he asks differs.
id: case.thorolf_bench
personas: [veteran]
truth:
  alive: { is: false }
  cause: { is: battle }
  grip: { is: weapon }
  weaponOwner: { is: self }
  blade: { is: plain }
  spearMark: { is: false }
  woundsFront: { is: 1 }
  woundsBack: { is: 0 }
  outlaw: { is: false }
  faith: { is: heathen }
  trickster: { is: false }
  nailsGrown: { is: false }
  gripHand: { is: right }
  hair: { is: fair }
  ornament: { is: none }
lies: []
look: { gender: m, name: Thorolf, patronym: Asgautsson, age: 38, build: heavy, beard: short }
lines: [case.thorolf.ford, case.thorolf.bought, case.thorolf.bench]
words: { pool.weapons: spear }
expect: VALHALLA
when: { state: flags.jarl_bribe, gte: 1 }
onStamp:
  - { stamped: '*', effects: [{ flag: thorolf_judged }] }
  - { stamped: VALHALLA, effects: [{ flag: thorolf_valhalla }] }
