  cause: { is: battle }
  grip: { is: none }
  woundsFront: { is: 1 }
  woundsBack: { is: 0 }
  outlaw: { is: false }
  faith: { is: heathen }
  trickster: { is: false }
  nailsGrown: { is: false }
lies: []
look: { gender: m, name: Kolskegg, patronym: Thorkelsson, age: 19, build: lean, beard: none }
