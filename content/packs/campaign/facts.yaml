# Day 6: the registry of outlaws and oathbreakers.
- id: outlaw
  domain: { bool: true }
  since: 6
  inert: false
  presumption: false
  # Only archetypes that ask for it are outlaws.
  prior: { 'false': 1, 'true': 0 }
# Someone else of the same name is in the registry (it only matters if the player looks).
- id: namesake
  domain: { bool: true }
  since: 6
  inert: false
  prior: { 'false': 3, 'true': 1 }
# Day 7: whose weapon it is, and who made it (read with the rune-lens).
- id: weaponOwner
  domain: { enum: [self, other] }
  since: 7
  inert: self
  presumption: self
  # Only archetypes that ask for it carry someone else's weapon.
  prior: { self: 1, other: 0 }
- id: blade
  domain: { enum: [plain, ulfberht, fakeUlfberht] }
  since: 7
  inert: plain
  prior: { plain: 6, ulfberht: 1, fakeUlfberht: 1 }
  # Ulfberhts are swords: a soul whose blade is marked, or who says it is, calls it a sword in every line.
  words: { ulfberht: { pool.weapons: sword }, fakeUlfberht: { pool.weapons: sword } }
# Day 8: Naglfar is built from dead men's untrimmed nails.
- id: nailsGrown
  domain: { bool: true }
  since: 8
  inert: false
  prior: { 'false': 2, 'true': 1 }
# Day 10: the clerk of the White Christ arrives. The baptized are his (TRANSFER). The prime-signed,
# who took only the sign of the cross (to trade with Christians, as Egill did in England), stay ours.
# Only archetypes that ask for it are anything but heathen.
- id: faith
  domain: { enum: [heathen, primeSigned, baptized] }
  since: 10
  inert: heathen
  presumption: heathen
  prior: { heathen: 1, primeSigned: 0, baptized: 0 }
# Whether a heathen wears Thor's hammer at the neck (it only shows what they are).
- id: thorsHammer
  domain: { bool: true }
  since: 10
  inert: false
  prior: { 'false': 1, 'true': 1 }
# Day 12: Loki walks in wearing a dead man's face. Everything about him fits the face he wears,
# except the scars on his lips where the dwarf Brokkr sewed them shut. Only his archetype sets it.
- id: trickster
  domain: { bool: true }
  since: 12
  inert: false
  presumption: false
  prior: { 'false': 1, 'true': 0 }
# Day 16: whether the soul lies, aloud or on a forged tally. Set by its lies, never sampled; the player
# learns it by catching a lie, and presumes honesty until then.
- id: liar
  domain: { bool: true }
  since: 16
  presumption: false
  fromLies: true
# Day 17: a spear point cut over the heart before death dedicates a straw death to Odin (Ynglinga saga).
# Only archetypes that ask for it carry the mark.
- id: spearMark
  domain: { bool: true }
  since: 17
  prior: { 'false': 1, 'true': 0 }
# Day 9: a jarl's sworn hearth-men who stood by him to the end go where he goes (docs/tech-spec.md §70). Never sampled:
# only a retinue sets it, on each of the jarl's men, to the hall he's bound for. Every other soul is sworn to no one.
- id: lordHall
  domain: { enum: [none, VALHALLA, FOLKVANGR, HEL] }
  since: 9
  inert: none
  fromParty: true
