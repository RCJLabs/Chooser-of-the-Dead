name: Deploy web demo

# Publishes the free web demo (Days 1-3 + Daily Shift) to GitHub Pages, and beside it, unlisted at /full/, the
# whole game (the playtest build; docs/tech-spec.md §48).
# Needs Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The path Pages serves the site from (today /Chooser-of-the-Dead). The demo's paths are absolute, so it's built
      # with this one rather than PAGES_BASE: renaming the repository moves the site, and a demo built for the old path
      # loads nothing (docs/tech-spec.md §64).
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build:web-demo
        env:
          COTS_BASE: ${{ steps.pages.outputs.base_path }}/
          # Optional links (Settings -> Secrets and variables -> Actions -> Variables).
          VITE_TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
          VITE_COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
          VITE_STEAM_URL: ${{ vars.STEAM_URL }}
      - run: pnpm leak-check --targets web-demo
      # The whole game, unlisted: its paths are relative and its saves are kept apart from the demo's. The commit
      # goes in the build, so its title screen and its playtest reports say which build it is.
      - run: VITE_BUILD="${GITHUB_SHA::7}" pnpm build:web-playtest
        env:
          VITE_TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
          VITE_COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
      - run: pnpm leak-check --targets web-playtest
      - name: Put the site together (the demo, and the whole game at /full/; PAGES_FULL in targets.ts)
        run: |
          mkdir -p dist/pages
          cp -R dist/web-demo/. dist/pages/
          cp -R dist/web-playtest dist/pages/full
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # What a visitor gets (docs/tech-spec.md §64): each page, fetched past the cache, and the first script it loads.
      # A page whose scripts don't load is a white screen, so the deploy fails rather than leaving it to be found.
      - name: Check the live pages load their scripts
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          check() {
            html=$(curl -fsSL "$1?deploy=$GITHUB_SHA") || return 1
            src=$(printf '%s' "$html" | grep -o 'src="[^"]*\.js"' | head -1 | sed 's/^src="//; s/"$//')
            [ -n "$src" ] || return 1
            url=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urljoin(sys.argv[1], sys.argv[2]))' "$1" "$src")
            curl -fsSL -o /dev/null "$url" && echo "ok: $1 loads $url"
          }
          for page in "$SITE" "${SITE}full/"; do
            for try in 1 2 3 4 5 6; do
              check "$page" && continue 2
              sleep 10
            done
            echo "::error::$page doesn't load its scripts: visitors get a white screen"
            exit 1
          done
