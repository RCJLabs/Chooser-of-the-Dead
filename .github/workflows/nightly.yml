name: Nightly sweep

# The full-size generator checks (docs/tech-spec.md §9): 10k seeds x every
# playable day, 10k Dailies, the days' parties (§69), the campaign bots, plus a
# deeper run of the fairness property tests. Each is its own job, and the generator sweep is split
# by days across four runners: run in one job, 20 days x 10k seeds took 50
# minutes and the whole night ran past an hour.
# Scheduled workflows run from the default branch.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    name: generator (days ${{ matrix.days }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Split by measured cost, not by count: later days have more souls and
        # more rules, so each range is about a quarter of the work. Seeds are
        # nightly-0..9999 on every day, the same pairs as one full sweep.
        days: ['1-10', '11-15', '16-18', '19-20']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim sweep --seeds 10000 --days ${{ matrix.days }} --prefix nightly

  # Each weave (docs/tech-spec.md §53) from its first day: the days made as above, their souls seen under the weave's
  # order. What's checked is what the weave changes: every soul dressed for it, and judged rightly by the careful bot.
  woven:
    name: generator woven (${{ matrix.weave }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { weave: weave.sea, days: '6-20' }
          - { weave: weave.clerkLast, days: '10-20' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim sweep --seeds 2000 --days ${{ matrix.days }} --prefix nightly --weave ${{ matrix.weave }}

  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dailies #1-#10000: about 27 years of them.
      - run: pnpm sim sweep --daily --seeds 10000

  parties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Linked souls (docs/tech-spec.md §69): every day with parties, each member checked with its companions, and a
      # careful bot at the desk.
      - run: pnpm sim sweep --parties --seeds 1000 --prefix nightly

  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bots with four skill levels and three night strategies play the campaign.
      - run: pnpm sim campaign --seeds 200

  fairness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/engine/src/gen
        env:
          FAIRNESS_RUNS: '2000'
